version: '3.3'

services:
  db:
    image: postgres:15

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nebulapicker

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

    ports:
      - "6379:6379"

volumes:
  pgdata:
